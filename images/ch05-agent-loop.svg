<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d"><title id="t">Agentic RAG: route, retrieve, criticize, answer</title><desc id="d">The question is first made specific by a query updater using earlier answers, then a router LLM picks a tool and arguments; your code runs the tool's AQL against ArangoDB and appends the result to the answers; a critic LLM lists missing information, which triggers one more round; finally an LLM answers using only the collected answers.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker><marker id="ahc0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#c0392b"/></marker></defs><rect x="1" y="1" width="958" height="518" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Agentic RAG: route, retrieve, criticize, answer</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">the LLM picks the retriever; your code runs it; a critic checks the result (once)</text><circle cx="50" cy="120" r="9.35" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><path d="M33.85,152.3 Q33.85,132.75 50,132.75 Q66.15,132.75 66.15,152.3 z" fill="#fde7e1" stroke="#c4462a" stroke-width="2" stroke-linejoin="round"/><rect x="84" y="104" width="160" height="50" rx="12" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><text x="164.0" y="133.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="164.0" dy="0">user question</tspan></text><path d="M246.0,129.0 L288.0,129.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="290" y="100" width="150" height="58" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="365.0" y="115.64999999999999" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="365.0" dy="0">1 · query updater</tspan></text><text x="365.0" y="135.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="365.0" dy="0">fills in earlier</tspan><tspan x="365.0" dy="16.25">answers</tspan></text><path d="M442.0,129.0 L486.0,129.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="488" y="100" width="150" height="58" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="563.0" y="123.77499999999999" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="563.0" dy="0">2 · router</tspan></text><text x="563.0" y="143.125" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="563.0" dy="0">LLM + tool calling</tspan></text><rect x="690" y="92" width="230" height="50" rx="12" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><text x="805.0" y="112.05" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="805.0" dy="0">movie_info_by_title</tspan></text><text x="805.0" y="130.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="805.0" dy="0">AQL template</tspan></text><path d="M640.0,129.0 L688.0,117.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="690" y="154" width="230" height="50" rx="12" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><text x="805.0" y="174.04999999999998" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="805.0" dy="0">movies_info_by_actor</tspan></text><text x="805.0" y="192.29999999999998" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="805.0" dy="0">AQL template</tspan></text><path d="M640.0,129.0 L688.0,179.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="690" y="216" width="230" height="50" rx="12" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><text x="805.0" y="236.04999999999998" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="805.0" dy="0">text2aql</tspan></text><text x="805.0" y="254.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="805.0" dy="0">LLM writes AQL (ch. 4)</tspan></text><path d="M640.0,129.0 L688.0,241.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="690" y="278" width="230" height="50" rx="12" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><text x="805.0" y="298.05" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="805.0" dy="0">answer_given</tspan></text><text x="805.0" y="316.30000000000007" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="805.0" dy="0">already answered</tspan></text><path d="M640.0,129.0 L688.0,303.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><path d="M712,362.56 L712,407.44 A95.0,10.56 0 0,0 902,407.44 L902,362.56" fill="#e8f4dc" stroke="#4c8a1d" stroke-width="2"/><ellipse cx="807.0" cy="362.56" rx="95.0" ry="10.56" fill="#ffffff" stroke="#4c8a1d" stroke-width="2"/><text x="807.0" y="391.63500000000005" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="807.0" dy="0">ArangoDB</tspan></text><text x="807.0" y="407.73500000000007" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="807.0" dy="0">read-only</tspan></text><path d="M805.0,340.0 L805.0,350.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><path d="M690.0,385.0 L520.0,385.0 L520.0,300.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="605.0" y="379.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="605.0" dy="0">results</tspan></text><rect x="410" y="240" width="220" height="58" rx="12" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="520.0" y="264.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="520.0" dy="0">answers so far</tspan></text><text x="520.0" y="283.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="520.0" dy="0">&quot;For the question X we have Y&quot;</tspan></text><path d="M408.0,270.0 L340.0,270.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="186" y="240" width="152" height="58" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="262.0" y="263.775" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="262.0" dy="0">3 · critic</tspan></text><text x="262.0" y="283.12499999999994" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="262.0" dy="0">anything missing?</tspan></text><path d="M262.0,238.0 L262.0,196.0 L365.0,196.0 L365.0,160.0" fill="none" stroke="#c0392b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#ahc0392b)"/><text x="313.5" y="188.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="313.5" dy="0">missing → new questions (one extra round)</tspan></text><path d="M262.0,300.0 L262.0,360.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="298.0" y="334.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="298.0" dy="0">complete</tspan></text><rect x="160" y="362" width="204" height="58" rx="12" fill="#e3f5ea" stroke="#1e8449" stroke-width="2"/><text x="262.0" y="385.77500000000003" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="262.0" dy="0">4 · final answer</tspan></text><text x="262.0" y="405.125" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="262.0" dy="0">only from the answers</tspan></text><text x="40" y="470" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal"><tspan x="40" dy="0">The LLM never touches the database - it only says WHICH tool and WHAT arguments.</tspan></text><text x="40" y="494" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal"><tspan x="40" dy="0">Your code executes the tool. That's where safety &amp; logging live.</tspan></text></svg>
