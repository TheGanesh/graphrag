<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d"><title id="t">Anatomy of a text2aql prompt</title><desc id="d">The prompt has an instruction, the database schema, terminology mappings, few-shot examples, format instructions and finally the user question; annotations explain what each part prevents.</desc><defs><marker id="ahc0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#c0392b"/></marker></defs><rect x="1" y="1" width="958" height="518" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Anatomy of a text2aql prompt</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">each section fixes a different way the LLM goes wrong</text><rect x="60" y="100" width="560" height="58" rx="10" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="76" y="124" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#a87500" text-anchor="start" font-weight="bold"><tspan x="76" dy="0">TASK</tspan></text><text x="76" y="144" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="76" dy="0">Write one AQL query that retrieves the data to answer the question.</tspan></text><path d="M626.0,129.0 L676.0,129.0" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahc0392b)"/><text x="684" y="134" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal"><tspan x="684" dy="0">sets the job</tspan></text><rect x="60" y="168" width="560" height="58" rx="10" fill="#e8f4dc" stroke="#4c8a1d" stroke-width="2"/><text x="76" y="192" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#4c8a1d" text-anchor="start" font-weight="bold"><tspan x="76" dy="0">SCHEMA</tspan></text><text x="76" y="212" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="76" dy="0">movies {title, released, tagline} · persons {name, born}</tspan></text><path d="M626.0,197.0 L676.0,197.0" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahc0392b)"/><text x="684" y="202" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal"><tspan x="684" dy="0">stops invented collections &amp; attributes</tspan></text><rect x="60" y="236" width="560" height="58" rx="10" fill="#f2efe8" stroke="#8b8578" stroke-width="2"/><text x="76" y="260" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8b8578" text-anchor="start" font-weight="bold"><tspan x="76" dy="0">TERMINOLOGY</tspan></text><text x="76" y="280" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="76" dy="0">actor / director / reviewer = persons + the edge type</tspan></text><path d="M626.0,265.0 L676.0,265.0" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahc0392b)"/><text x="684" y="270" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal"><tspan x="684" dy="0">maps the user's words to the model</tspan></text><rect x="60" y="304" width="560" height="58" rx="10" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><text x="76" y="328" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2b67ad" text-anchor="start" font-weight="bold"><tspan x="76" dy="0">EXAMPLES</tspan></text><text x="76" y="348" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="76" dy="0">Question: ...  AQL: FOR p1 IN persons ...</tspan></text><path d="M626.0,333.0 L676.0,333.0" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahc0392b)"/><text x="684" y="338" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal"><tspan x="684" dy="0">teaches patterns it keeps getting wrong</tspan></text><rect x="60" y="372" width="560" height="58" rx="10" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/><text x="76" y="396" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold"><tspan x="76" dy="0">FORMAT</tspan></text><text x="76" y="416" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="76" dy="0">AQL only. No prose, no code fences.</tspan></text><path d="M626.0,401.0 L676.0,401.0" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahc0392b)"/><text x="684" y="406" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal"><tspan x="684" dy="0">makes the output parseable</tspan></text><rect x="60" y="440" width="560" height="58" rx="10" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><text x="76" y="464" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#c4462a" text-anchor="start" font-weight="bold"><tspan x="76" dy="0">QUESTION</tspan></text><text x="76" y="484" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="76" dy="0">Who directed the most movies?</tspan></text><path d="M626.0,469.0 L676.0,469.0" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahc0392b)"/><text x="684" y="474" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal"><tspan x="684" dy="0">goes last</tspan></text></svg>
