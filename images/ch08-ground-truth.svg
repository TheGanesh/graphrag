<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d"><title id="t">A benchmark row whose ground truth is a query</title><desc id="d">Each benchmark row has a question and an AQL query. The query runs against today's database to produce the ground truth; the agent answers the same question; the judge compares the two. Static answers are AQL RETURN of a string.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker></defs><rect x="1" y="1" width="958" height="328" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">A benchmark row whose ground truth is a query</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">the expected answer is computed fresh, so the test stays valid when the data changes</text><rect x="40" y="100" width="420" height="150.39999999999998" rx="10" fill="#1f2933" stroke="#1f2933" stroke-width="1.5"/><text x="52" y="123" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="start" font-weight="bold"><tspan x="52" dy="0">data/benchmark.csv</tspan></text><text x="52" y="146" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" xml:space="preserve"><tspan fill="#e8edf2">question</tspan><tspan fill="#e8edf2">;</tspan><tspan fill="#e8edf2">aql</tspan></text><text x="52" y="163.4" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" xml:space="preserve"><tspan fill="#e8edf2">How</tspan><tspan fill="#e8edf2"> </tspan><tspan fill=