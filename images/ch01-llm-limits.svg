<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d"><title id="t">Four ways a lone LLM goes wrong</title><desc id="d">A timeline of public training text ends at the knowledge cutoff; later events and private company data never reach the model's weights, which leads to cutoff gaps, outdated answers, confident hallucinations and ignorance of private facts.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker><marker id="ahc0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#c0392b"/></marker></defs><rect x="1" y="1" width="958" height="468" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Four ways a lone LLM goes wrong</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">it only knows what was baked into its weights at training time</text><rect x="60" y="110" width="520" height="34" rx="8" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="320" y="133" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="320" dy="0">public text the model was trained on</tspan></text><rect x="600" y="110" width="300" height="34" rx="8" fill="#f2efe8" stroke="#8b8578" stroke-width="2" stroke-dasharray="7 5"/><text x="750" y="133" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="750" dy="0">the world keeps changing...</tspan></text><line x1="590" y1="96" x2="590" y2="160" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4"/><text x="590" y="92" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="normal"><tspan x="590" dy="0">knowledge cutoff</tspan></text><path d="M250.0,146.0 L250.0,214.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="328.0" y="184.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="328.0" dy="0">training (months, $$$)</tspan></text><line x1="188.0" y1="209" x2="188.0" y2="216" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="188.0" y1="290" x2="188.0" y2="297" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="229.33333333333334" y1="209" x2="229.33333333333334" y2="216" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="229.33333333333334" y1="290" x2="229.33333333333334" y2="297" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="270.6666666666667" y1="209" x2="270.6666666666667" y2="216" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="270.6666666666667" y1="290" x2="270.6666666666667" y2="297" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="312.0" y1="209" x2="312.0" y2="216" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="312.0" y1="290" x2="312.0" y2="297" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><rect x="170" y="216" width="160" height="74" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="250.0" y="248.475" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="250.0" dy="0">LLM</tspan></text><text x="250.0" y="269.925" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="250.0" dy="0">frozen weights</tspan></text><path d="M314,225 l2.5,6 6,2.5 -6,2.5 -2.5,6 -2.5,-6 -6,-2.5 6,-2.5 z" fill="#6847c0" opacity="0.8"/><rect x="700" y="210" width="220" height="80" rx="12" fill="#f2efe8" stroke="#8b8578" stroke-width="2"/><text x="810.0" y="245.475" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="810.0" dy="0">Your private data</tspan></text><text x="810.0" y="266.925" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="810.0" dy="0">contracts, tickets, wikis, DBs</tspan></text><rect x="895" y="198" width="26" height="22" rx="4" fill="#8b8578"/><path d="M900,198 v-7 a8,8 0 0 1 16,0 v7" fill="none" stroke="#8b8578" stroke-width="3"/><path d="M698.0,252.0 L338.0,252.0" fill="none" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#ahc0392b)"/><text x="518.0" y="256.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="518.0" dy="0">never seen</tspan></text><text x="520" y="249" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#c0392b" text-anchor="middle" font-weight="bold"><tspan x="520" dy="0">✕</tspan></text><circle cx="80" cy="325" r="13" fill="#c4462a"/><text x="80" y="330" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="80" dy="0">1</tspan></text><text x="102" y="330" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold"><tspan x="102" dy="0">Cutoff</tspan></text><text x="250" y="330" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#5b6670" text-anchor="start" font-weight="normal" font-style="italic"><tspan x="250" dy="0">&quot;I have no information after my training date.&quot;</tspan></text><circle cx="80" cy="357" r="13" fill="#c4462a"/><text x="80" y="362" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="80" dy="0">2</tspan></text><text x="102" y="362" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold"><tspan x="102" dy="0">Outdated</tspan></text><text x="250" y="362" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#5b6670" text-anchor="start" font-weight="normal" font-style="italic"><tspan x="250" dy="0">&quot;Mark Cuban owns the Dallas Mavericks.&quot; (was true once)</tspan></text><circle cx="80" cy="389" r="13" fill="#c4462a"/><text x="80" y="394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="80" dy="0">3</tspan></text><text x="102" y="394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold"><tspan x="102" dy="0">Hallucination</tspan></text><text x="250" y="394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#5b6670" text-anchor="start" font-weight="normal" font-style="italic"><tspan x="250" dy="0">&quot;Its WikiData ID is Q152232.&quot; (confident &amp; wrong)</tspan></text><circle cx="80" cy="421" r="13" fill="#c4462a"/><text x="80" y="426" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="80" dy="0">4</tspan></text><text x="102" y="426" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold"><tspan x="102" dy="0">No private data</tspan></text><text x="250" y="426" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#5b6670" text-anchor="start" font-weight="normal" font-style="italic"><tspan x="250" dy="0">&quot;I can't see your Q3 supplier contract.&quot;</tspan></text><path d="M250.0,292.0 L250.0,312.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1f2933)"/><g transform="rotate(2 810.0 375.4)"><rect x="693" y="334" width="240" height="90.8" fill="#000" opacity="0.06" rx="3"/><rect x="690" y="330" width="240" height="90.8" fill="#fff6b3" stroke="#d8bd3a" stroke-width="1.5" rx="3"/><text x="700" y="354" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="700" dy="0">Fix: put the facts in the</tspan><tspan x="700" dy="18.2">prompt at question time</tspan><tspan x="700" dy="18.2">(RAG) - and keep them in a</tspan><tspan x="700" dy="18.2">graph.</tspan></text></g></svg>
