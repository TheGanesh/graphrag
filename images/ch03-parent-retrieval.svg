<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d"><title id="t">Parent document retrieval in ArangoDB</title><desc id="d">The pdfs collection links to parents via has_parent, and parents link to embedded children via has_child. A query finds the k times 4 nearest children with APPROX_NEAR_COSINE, walks INBOUND has_child to their parents, then COLLECTs to keep each parent once with its best score.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker><marker id="ahb9b2a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#b9b2a2"/></marker><marker id="ah2b67ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#2b67ad"/></marker></defs><rect x="1" y="1" width="958" height="468" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Parent document retrieval in ArangoDB</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">children are matched, parents are returned, each parent only once</text><path d="M412.9,152.9 L235.3,237.9" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><path d="M440.0,170.0 L440.0,222.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><path d="M467.1,152.9 L644.7,237.9" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><path d="M195.6,271.6 L140.0,355.0" fill="none" stroke="#b9b2a2" stroke-width="2" stroke-linecap="round" marker-end="url(#ahb9b2a2)"/><path d="M205.7,275.6 L193.0,352.2" fill="none" stroke="#2b67ad" stroke-width="2" stroke-linecap="round" marker-end="url(#ah2b67ad)"/><path d="M218.2,274.7 L244.3,352.9" fill="none" stroke="#2b67ad" stroke-width="2" stroke-linecap="round" marker-end="url(#ah2b67ad)"/><path d="M428.4,273.3 L388.0,353.9" fill="none" stroke="#2b67ad" stroke-width="2" stroke-linecap="round" marker-end="url(#ah2b67ad)"/><path d="M440.0,276.0 L440.0,352.0" fill="none" stroke="#2b67ad" stroke-width="2" stroke-linecap="round" marker-end="url(#ah2b67ad)"/><path d="M451.6,273.3 L492.0,353.9" fill="none" stroke="#2b67ad" stroke-width="2" stroke-linecap="round" marker-end="url(#ah2b67ad)"/><path d="M658.4,273.3 L618.0,353.9" fill="none" stroke="#b9b2a2" stroke-width="2" stroke-linecap="round" marker-end="url(#ahb9b2a2)"/><path d="M670.0,276.0 L670.0,352.0" fill="none" stroke="#2b67ad" stroke-width="2" stroke-linecap="round" marker-end="url(#ah2b67ad)"/><path d="M681.6,273.3 L722.0,353.9" fill="none" stroke="#b9b2a2" stroke-width="2" stroke-linecap="round" marker-end="url(#ahb9b2a2)"/><circle cx="440" cy="140" r="30" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="480" y="145" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold"><tspan x="480" dy="0">pdfs/1709.00666</tspan></text><circle cx="210" cy="250" r="26" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="242" y="255" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold"><tspan x="242" dy="0">parents/…-0</tspan></text><circle cx="440" cy="250" r="26" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="472" y="255" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold"><tspan x="472" dy="0">parents/…-1</tspan></text><circle cx="670" cy="250" r="26" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="702" y="255" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold"><tspan x="702" dy="0">parents/…-2</tspan></text><circle cx="130" cy="370" r="16" fill="#ffffff" stroke="#b9b2a2" stroke-width="2"/><circle cx="190" cy="370" r="16" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><circle cx="250" cy="370" r="16" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><circle cx="380" cy="370" r="16" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><circle cx="440" cy="370" r="16" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><circle cx="500" cy="370" r="16" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><circle cx="610" cy="370" r="16" fill="#ffffff" stroke="#b9b2a2" stroke-width="2"/><circle cx="670" cy="370" r="16" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><circle cx="730" cy="370" r="16" fill="#ffffff" stroke="#b9b2a2" stroke-width="2"/><text x="250" y="188" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="start" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="250" dy="0">has_parent</tspan></text><text x="60" y="318" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="start" font-weight="normal" font-style="italic"><tspan x="60" dy="0">has_child</tspan></text><text x="430" y="418" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="430" dy="0">children: 500 chars + embedding</tspan></text><circle cx="800" cy="372" r="13" fill="#c4462a"/><text x="800" y="377" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="800" dy="0">1</tspan></text><text x="822" y="377" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="822" dy="0">6 children hit</tspan></text><circle cx="800" cy="252" r="13" fill="#c4462a"/><text x="800" y="257" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="800" dy="0">2</tspan></text><text x="822" y="257" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="822" dy="0">walk INBOUND</tspan></text><circle cx="800" cy="150" r="13" fill="#c4462a"/><text x="800" y="155" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="800" dy="0">3</tspan></text><text x="822" y="155" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="822" dy="0">COLLECT:</tspan></text><text x="822" y="173" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="822" dy="0">3 parents,</tspan></text><text x="822" y="191" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="822" dy="0">best score</tspan></text><text x="40" y="452" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="14" fill="#c0392b" text-anchor="start" font-weight="normal"><tspan x="40" dy="0">ask for k×4 children: several hits often share one parent, and we still want k parents</tspan></text></svg>
