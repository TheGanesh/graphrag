e</tspan></text><text x="646" y="392" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="646" dy="0">• …5-10 findings in total</tspan></text><path d="M300.0,170.0 Q460.8,155.1 616.0,200.0" fill="none" stroke="#2b67ad" stroke-width="2" stroke-linecap="round" marker-end="url(#ah2b67ad)"/></svg>
