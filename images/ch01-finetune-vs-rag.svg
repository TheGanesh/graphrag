<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d"><title id="t">Two ways to give an LLM new facts</title><desc id="d">Left: supervised finetuning feeds question/answer pairs through training to change the weights - slow and unreliable for new facts. Right: retrieval-augmented generation looks up relevant facts at question time and puts them into the prompt.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker></defs><rect x="1" y="1" width="958" height="468" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Two ways to give an LLM new facts</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">change its weights... or hand it the facts with every question</text><text x="240" y="108" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="240" dy="0">Supervised finetuning</tspan></text><rect x="60" y="130" width="360" height="64" rx="12" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="240.0" y="156.775" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="240.0" dy="0">Q: Who won the 2023 NBA title?</tspan></text><text x="240.0" y="176.12500000000003" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="240.0" dy="0">A: the Denver Nuggets</tspan></text><path d="M240.0,196.0 L240.0,240.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="296.0" y="222.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="296.0" dy="0">training run</tspan></text><line x1="183.0" y1="237" x2="183.0" y2="244" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="183.0" y1="314" x2="183.0" y2="321" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="221.0" y1="237" x2="221.0" y2="244" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="221.0" y1="314" x2="221.0" y2="321" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="259.0" y1="237" x2="259.0" y2="244" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="259.0" y1="314" x2="259.0" y2="321" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="297.0" y1="237" x2="297.0" y2="244" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="297.0" y1="314" x2="297.0" y2="321" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><rect x="165" y="244" width="150" height="70" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="240.0" y="274.47499999999997" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="240.0" dy="0">LLM</tspan></text><text x="240.0" y="295.92499999999995" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="240.0" dy="0">weights nudged</tspan></text><path d="M299,253 l2.5,6 6,2.5 -6,2.5 -2.5,6 -2.5,-6 -6,-2.5 6,-2.5 z" fill="#6847c0" opacity="0.8"/><g transform="rotate(-1 240.0 371.2)"><rect x="63" y="348" width="360" height="54.4" fill="#000" opacity="0.06" rx="3"/><rect x="60" y="344" width="360" height="54.4" fill="#fff6b3" stroke="#d8bd3a" stroke-width="1.5" rx="3"/><text x="70" y="368" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="70" dy="0">Slow &amp; costly to repeat. Studies disagree</tspan><tspan x="70" dy="18.2">on whether new facts even stick.</tspan></text></g><line x1="480" y1="100" x2="480" y2="440" stroke="#e3d9c6" stroke-width="2" stroke-dasharray="4 6"/><text x="720" y="108" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="720" dy="0">Retrieval-augmented generation (RAG)</tspan></text><circle cx="540" cy="140" r="8.8" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><path d="M524.8,170.4 Q524.8,152.0 540,152.0 Q555.2,152.0 555.2,170.4 z" fill="#fde7e1" stroke="#c4462a" stroke-width="2" stroke-linejoin="round"/><rect x="580" y="128" width="150" height="40" rx="12" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><text x="655.0" y="152.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="655.0" dy="0">question</tspan></text><path d="M732.0,148.0 L790.0,148.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="761.0" y="152.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="761.0" dy="0">search</tspan></text><path d="M792,129.52 L792,178.48 A70.0,11.52 0 0,0 932,178.48 L932,129.52" fill="#e8f4dc" stroke="#4c8a1d" stroke-width="2"/><ellipse cx="862.0" cy="129.52" rx="70.0" ry="11.52" fill="#ffffff" stroke="#4c8a1d" stroke-width="2"/><text x="862.0" y="161.59499999999997" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="862.0" dy="0">knowledge</tspan></text><text x="862.0" y="177.69499999999996" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="862.0" dy="0">base</tspan></text><path d="M862.0,192.0 L862.0,228.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="800.0" y="214.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="800.0" dy="0">relevant facts</tspan></text><rect x="520" y="232" width="420" height="102.55" rx="10" fill="#1f2933" stroke="#1f2933" stroke-width="1.5"/><text x="532" y="255" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#9fb3c8" text-anchor="start" font-weight="bold"><tspan x="532" dy="0">PROMPT TEMPLATE</tspan></text><text x="532" y="279" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e8edf2" xml:space="preserve">Use only this context:</text><text x="532" y="297.85" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e8edf2" xml:space="preserve">  {context}</text><text x="532" y="316.70000000000005" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e8edf2" xml:space="preserve">Question: {question}</text><path d="M730.0,334.0 L730.0,362.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><line x1="673.0" y1="357" x2="673.0" y2="364" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="673.0" y1="420" x2="673.0" y2="427" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="711.0" y1="357" x2="711.0" y2="364" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="711.0" y1="420" x2="711.0" y2="427" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="749.0" y1="357" x2="749.0" y2="364" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="749.0" y1="420" x2="749.0" y2="427" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="787.0" y1="357" x2="787.0" y2="364" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="787.0" y1="420" x2="787.0" y2="427" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><rect x="655" y="364" width="150" height="56" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="730.0" y="397.59999999999997" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="730.0" dy="0">LLM</tspan></text><path d="M789,373 l2.5,6 6,2.5 -6,2.5 -2.5,6 -2.5,-6 -6,-2.5 6,-2.5 z" fill="#6847c0" opacity="0.8"/><path d="M807.0,392.0 L868.0,392.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="870" y="372" width="72" height="40" rx="12" fill="#e3f5ea" stroke="#1e8449" stroke-width="2"/><text x="906.0" y="396.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="906.0" dy="0">answer</tspan></text><text x="530" y="440" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="15" fill="#1e8449" text-anchor="start" font-weight="normal"><tspan x="530" dy="0">fresh, private, citable - no retraining</tspan></text></svg>
