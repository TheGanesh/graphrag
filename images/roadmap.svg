<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d"><title id="t">The road through this guide</title><desc id="d">Roadmap of the nine chapters as stops on a winding road: unstructured retrieval (chapters 2-3), querying structure (4-5), building graphs (6-7), evaluation (8), big picture (9).</desc><defs></defs><rect x="1" y="1" width="958" height="558" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">The road through this guide</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">from &quot;the LLM is guessing&quot; to &quot;an evaluated, agentic GraphRAG system&quot;</text><path d="M80,150 L860,150 Q910,150 910,200 L910,270 Q910,320 860,320 L120,320 Q70,320 70,370 L70,440 Q70,490 120,490 L880,490" fill="none" stroke="#d9d2c3" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><path d="M80,150 L860,150 Q910,150 910,200 L910,270 Q910,320 860,320 L120,320 Q70,320 70,370 L70,440 Q70,490 120,490 L880,490" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="14 12"/><circle cx="150" cy="150" r="20" fill="#8b8578" stroke="#fff" stroke-width="3"/><text x="150" y="156" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold"><tspan x="150" dy="0">1</tspan></text><text x="150" y="116" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="150" dy="0">Why LLMs need help</tspan></text><text x="150" y="194" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="150" dy="0">RAG + knowledge graphs</tspan></text><circle cx="450" cy="150" r="20" fill="#a87500" stroke="#fff" stroke-width="3"/><text x="450" y="156" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold"><tspan x="450" dy="0">2</tspan></text><text x="450" y="116" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="450" dy="0">Vector &amp; hybrid search</tspan></text><text x="450" y="194" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="450" dy="0">APPROX_NEAR_COSINE + BM25</tspan></text><circle cx="750" cy="150" r="20" fill="#a87500" stroke="#fff" stroke-width="3"/><text x="750" y="156" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold"><tspan x="750" dy="0">3</tspan></text><text x="750" y="116" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="750" dy="0">Smarter vector retrieval</tspan></text><text x="750" y="194" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="750" dy="0">step-back + parent docs</tspan></text><circle cx="780" cy="320" r="20" fill="#2b67ad" stroke="#fff" stroke-width="3"/><text x="780" y="326" font-family="'Helvetica Neue