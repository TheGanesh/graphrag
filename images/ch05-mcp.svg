<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d"><title id="t">Same tools, two ways to host them</title><desc id="d">Left: your Python process holds tool schemas, calls the LLM, runs the router loop and executes AQL. Right: an MCP server exposes the same tools; an MCP host such as a desktop assistant or IDE agent runs the reasoning loop and calls the tools over MCP; the server queries ArangoDB read-only.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker></defs><rect x="1" y="1" width="958" height="428" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Same tools, two ways to host them</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">an in-process router (this chapter) vs. an MCP server any agent can use (bonus)</text><rect x="30" y="92" width="430" height="310" rx="16" fill="#ffffff" stroke="#e3d9c6" stroke-width="2"/><rect x="500" y="92" width="430" height="310" rx="16" fill="#ffffff" stroke="#e3d9c6" stroke-width="2"/><text x="245" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="245" dy="0">In-process (ch05_agentic_rag.py)</tspan></text><text x="715" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="715" dy="0">MCP server (ch05_mcp_server.py)</tspan></text><rect x="60" y="150" width="370" height="110" rx="12" fill="#ffffff" stroke="#3d4852" stroke-width="2"/><text x="245.0" y="192.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="245.0" dy="0">your Python app</tspan></text><text x="245.0" y="212.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="245.0" dy="0">router loop · query updater · critic · tool</tspan><tspan x="245.0" dy="16.25">functions</tspan></text><line x1="88.0" y1="283" x2="88.0" y2="290" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="88.0" y1="346" x2="88.0" y2="353" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="116.0" y1="283" x2="116.0" y2="290" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="116.0" y1="346" x2="116.0" y2="353" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="144.0" y1="283" x2="144.0" y2="290" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="144.0" y1="346" x2="144.0" y2="353" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="172.0" y1="283" x2="172.0" y2="290" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="172.0" y1="346" x2="172.0" y2="353" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><rect x="70" y="290" width="120" height="56" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="130.0" y="323.59999999999997" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="130.0" dy="0">LLM</tspan></text><path d="M174,299 l2.5,6 6,2.5 -6,2.5 -2.5,6 -2.5,-6 -6,-2.5 6,-2.5 z" fill="#6847c0" opacity="0.8"/><path d="M130.0,288.0 L130.0,262.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)" marker-start="url(#ah1f2933)"/><text x="174.0" y="279.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="174.0" dy="0">chat API</tspan></text><path d="M280,295.2 L280,342.8 A70.0,11.200000000000001 0 0,0 420,342.8 L420,295.2" fill="#e8f4dc" stroke="#4c8a1d" stroke-width="2"/><ellipse cx="350.0" cy="295.2" rx="70.0" ry="11.200000000000001" fill="#ffffff" stroke="#4c8a1d" stroke-width="2"/><text x="350.0" y="334.40000000000003" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="350.0" dy="0">ArangoDB</tspan></text><path d="M350.0,262.0 L350.0,282.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)" marker-start="url(#ah1f2933)"/><rect x="530" y="150" width="180" height="70" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="620.0" y="180.125" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="620.0" dy="0">MCP host</tspan></text><text x="620.0" y="200.525" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="620.0" dy="0">Claude, IDE agent, …</tspan></text><rect x="530" y="280" width="180" height="90" rx="12" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><text x="620.0" y="320.125" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="620.0" dy="0">MCP server</tspan></text><text x="620.0" y="340.525" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="620.0" dy="0">3 tools, typed params</tspan></text><path d="M620.0,222.0 L620.0,278.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)" marker-start="url(#ah1f2933)"/><text x="672.0" y="254.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="672.0" dy="0">MCP (stdio)</tspan></text><path d="M760,297.2 L760,344.8 A70.0,11.200000000000001 0 0,0 900,344.8 L900,297.2" fill="#e8f4dc" stroke="#4c8a1d" stroke-width="2"/><ellipse cx="830.0" cy="297.2" rx="70.0" ry="11.200000000000001" fill="#ffffff" stroke="#4c8a1d" stroke-width="2"/><text x="830.0" y="328.27500000000003" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="830.0" dy="0">ArangoDB</tspan></text><text x="830.0" y="344.37500000000006" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="830.0" dy="0">read-only</tspan></text><path d="M712.0,322.0 L758.0,322.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)" marker-start="url(#ah1f2933)"/><g transform="rotate(2 825.0 192.8)"><rect x="743" y="154" width="170" height="85.60000000000001" fill="#000" opacity="0.06" rx="3"/><rect x="740" y="150" width="170" height="85.60000000000001" fill="#fff6b3" stroke="#d8bd3a" stroke-width="1.5" rx="3"/><text x="750" y="173" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="750" dy="0">The host runs the</tspan><tspan x="750" dy="16.900000000000002">loop; your server</tspan><tspan x="750" dy="16.900000000000002">just answers tool</tspan><tspan x="750" dy="16.900000000000002">calls.</tspan></text></g></svg>
