df2"> </tspan><tspan fill="#ffc66d">WITH</tspan><tspan fill="#e8edf2"> </tspan><tspan fill="#e8edf2">{</tspan><tspan fill="#e8edf2"> </tspan><tspan fill="#e8edf2">_from</tspan><tspan fill="#e8edf2">:</tspan><tspan fill="#e8edf2"> </tspan><tspan fill="#e8edf2">survivor</tspan><tspan fill="#e8edf2"> </tspan><tspan fill="#e8edf2">}</tspan><tspan fill="#e8edf2"> </tspan><tspan fill="#ffc66d">IN</tspan><tspan fill="#e8edf2"> </tspan><tspan fill="#e8edf2">has_party</tspan><tspan fill="#e8edf2">   </tspan><tspan fill="#8b9aa8">// _from is mutable</tspan></text><text x="50" y="369.4" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" xml:space="preserve"><tspan fill="#ffc66d">REMOVE</tspan><tspan fill="#e8edf2"> </tspan><tspan fill="#e8edf2">duplicate</tspan><tspan fill="#e8edf2"> </tspan><tspan fill="#ffc66d">IN</tspan><tspan fill="#e8edf2"> </tspan><tspan fill="#e8edf2">organizations</tspan></text><g transform="rotate(2 787.0 284.35)"><rect x="655" y="254" width="270" height="68.7" fill="#000" opacity="0.06" rx="3"/><rect x="652" y="250" width="270" height="68.7" fill="#fff6b3" stroke="#d8bd3a" stroke-width="1.5" rx="3"/><text x="662" y="273" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="662" dy="0">Domain rules beat generic ones:</tspan><tspan x="662" dy="16.900000000000002">'Ltd' = 'Limited' is safe; 'Apple'</tspan><tspan x="662" dy="16.900000000000002">vs 'Apple Records' is not.</tspan></text></g></svg>
