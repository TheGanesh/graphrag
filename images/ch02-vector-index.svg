ed when nProbe = 1</tspan></text><text x="520" y="98" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="start" font-weight="normal"><tspan x="520" dy="0">IVF index: nLists cells,  × = centroid</tspan></text><rect x="520" y="467" width="217.60000000000002" height="22" rx="11.0" fill="#e4effb" stroke="#2b67ad" stroke-width="1.2"/><text x="628.8" y="483" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="628.8" dy="0">nProbe = 1: only the blue cell</tspan></text><rect x="740" y="467" width="210.88000000000002" height="22" rx="11.0" fill="#e4effb" stroke="#2b67ad" stroke-width="1.2"/><text x="845.44" y="483" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="845.44" dy="0">nProbe = 2: + the dashed cell</tspan></text></svg>
