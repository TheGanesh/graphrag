<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" width="960" height="545" role="img" aria-labelledby="t d"><title id="t">How vector search finds &quot;similar&quot;</title><desc id="d">Left: chunks and the question are points; similarity is the cosine of the angle between their vectors. Right: an IVF vector index groups vectors into cells around centroids (nLists); a query only searches the nearest nProbe cells, which is fast but approximate - a true neighbour just across a cell border can be missed.</desc><defs><marker id="ahc4462a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#c4462a"/></marker><marker id="aha87500" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#a87500"/></marker><marker id="ahb9b2a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#b9b2a2"/></marker></defs><rect x="1" y="1" width="958" height="543" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">How vector search finds &quot;similar&quot;</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">cosine similarity, and how ArangoDB's IVF vector index avoids comparing against everything</text><line x1="90" y1="430" x2="450" y2="430" stroke="#b9b2a2" stroke-width="1.5"/><line x1="90" y1="430" x2="90" y2="110" stroke="#b9b2a2" stroke-width="1.5"/><circle cx="260" cy="170" r="6" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="270" y="174" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal"><tspan x="270" dy="0">lab work</tspan></text><circle cx="300" cy="205" r="6" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="310" y="209" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal"><tspan x="310" dy="0">experiments</tspan></text><circle cx="380" cy="330" r="6" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="390" y="334" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal"><tspan x="390" dy="0">patents</tspan></text><circle cx="220" cy="395" r="6" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="230" y="399" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal"><tspan x="230" dy="0">Zurich</tspan></text><circle cx="420" cy="380" r="6" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="430" y="384" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal"><tspan x="430" dy="0">refrigerator</tspan></text><path d="M90.0,430.0 L318.0,160.0" fill="none" stroke="#c4462a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ahc4462a)"/><path d="M90.0,430.0 L260.0,170.0" fill="none" stroke="#a87500" stroke-width="2" stroke-linecap="round" marker-end="url(#aha87500)"/><path d="M90.0,430.0 L420.0,380.0" fill="none" stroke="#b9b2a2" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahb9b2a2)"/><path d="M167.4,338.3 A 120 120 0 0 0 155.7,329.6" fill="none" stroke="#c0392b" stroke-width="2.4"/><text x="198" y="280" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="14" fill="#c0392b" text-anchor="start" font-weight="normal"><tspan x="198" dy="0">small angle θ</tspan></text><text x="198" y="298" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="14" fill="#c0392b" text-anchor="start" font-weight="normal"><tspan x="198" dy="0">= similar meaning</tspan></text><path d="M318,149 l3,7 8,1 -6,5 2,8 -7,-4 -7,4 2,-8 -6,-5 8,-1 z" fill="#c4462a"/><text x="330" y="154" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#c4462a" text-anchor="start" font-weight="bold"><tspan x="330" dy="0">question</tspan></text><rect x="70" y="96" width="380" height="50.8" rx="10" fill="#ffffff" stroke="#b9b2a2" stroke-width="1.5"/><text x="78" y="116" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1f2933" xml:space="preserve">score = cos θ   (1 = same direction,</text><text x="78" y="133.4" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1f2933" xml:space="preserve">               0 = unrelated)</text><path d="M520.0,110.0 L652.9,110.0 L669.9,229.3 L641.1,262.6 L520.0,268.9 Z" fill="#ffffff" stroke="#b9b2a2" stroke-width="2"/><path d="M652.9,110.0 L823.2,110.0 L783.3,221.8 L669.9,229.3 Z" fill="#f0f6fd" stroke="#2b67ad" stroke-width="2" stroke-dasharray="6 4"/><path d="M823.2,110.0 L930.0,110.0 L930.0,295.0 L839.6,295.0 L783.3,221.8 Z" fill="#ffffff" stroke="#b9b2a2" stroke-width="2"/><path d="M721.4,450.0 L520.0,450.0 L520.0,268.9 L641.1,262.6 Z" fill="#ffffff" stroke="#b9b2a2" stroke-width="2"/><path d="M732.3,450.0 L721.4,450.0 L641.1,262.6 L669.9,229.3 L783.3,221.8 L839.6,295.0 Z" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><path d="M930.0,295.0 L930.0,450.0 L732.3,450.0 L839.6,295.0 Z" fill="#ffffff" stroke="#b9b2a2" stroke-width="2"/><circle cx="585.7" cy="174.5" r="4.5" fill="#fff3d4" stroke="#a87500" stroke-width="1.6"/><circle cx="628.2" cy="167.4" r="4.5" fill="#fff3d4" stroke="#a87500" stroke-width="1.6"/><circle c