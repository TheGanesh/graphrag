<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d"><title id="t">The contract graph in ArangoDB</title><desc id="d">organizations link to contracts through has_party edges carrying a role, and to locations through located_at edges; contracts link to contract_chunks through has_chunk. Contracts are keyed by a hash of the document; organizations.name and locations.full_address have unique indexes.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker></defs><rect x="1" y="1" width="958" height="418" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">The contract graph in ArangoDB</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">keys and unique indexes do the job of Neo4j's uniqueness constraints</text><rect x="40" y="104" width="230" height="70" rx="12" fill="#f2efe8" stroke="#8b8578" stroke-width="2"/><text x="155.0" y="134.475" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="155.0" dy="0">locations</tspan></text><text x="155.0" y="155.92499999999998" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="155.0" dy="0">unique index: full_address</tspan></text><rect x="40" y="240" width="230" height="70" rx="12" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><text x="155.0" y="270.475" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="155.0" dy="0">organizations</tspan></text><text x="155.0" y="291.925" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="155.0" dy="0">unique index: name</tspan></text><rect x="390" y="240" width="240" height="70" rx="12" fill="#e8f4dc" stroke="#4c8a1d" stroke-width="2"/><text x="510.0" y="270.475" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="510.0" dy="0">contracts</tspan></text><text x="510.0" y="291.925" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="510.0" dy="0">_key = hash(document text)</tspan></text><rect x="730" y="240" width="200" height="70" rx="12" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="830.0" y="270.475" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="830.0" dy="0">contract_chunks</tspan></text><text x="830.0" y="291.925" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="830.0" dy="0">one clause per chunk</tspan></text><path d="M155.0,238.0 L155.0,176.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="203.0" y="211.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="203.0" dy="0">located_at</tspan></text><path d="M272.0,275.0 L388.0,275.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="330.0" y="265.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="330.0" dy="0">has_party {role}</tspan></text><path d="M632.0,275.0 L728.0,275.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="680.0" y="265.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="680.0" dy="0">has_chunk</tspan></text><rect x="390" y="326" width="240" height="63.849999999999994" rx="10" fill="#ffffff" stroke="#b9b2a2" stroke-width="1.5"/><text x="398" y="345" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">contract_type, effective_date,</text><text x="398" y="360.95" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">end_date, term, contract_scope,</text><text x="398" y="376.9" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">total_amount, governing_law</text><rect x="730" y="326" width="200" height="31.95" rx="10" fill="#ffffff" stroke="#b9b2a2" stroke-width="1.5"/><text x="738" y="345" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">text, embedding</text><g transform="rotate(-1.5 180.0 359.9)"><rect x="43" y="338" width="280" height="51.800000000000004" fill="#000" opacity="0.06" rx="3"/><rect x="40" y="334" width="280" height="51.800000000000004" fill="#fff6b3" stroke="#d8bd3a" stroke-width="1.5" rx="3"/><text x="50" y="357" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="50" dy="0">re-import the same contract → same</tspan><tspan x="50" dy="16.900000000000002">_key → updated, not duplicated</tspan></text></g><g transform="rotate(1.5 710.0 154.35)"><rect x="563" y="124" width="300" height="68.7" fill="#000" opacity="0.06" rx="3"/><rect x="560" y="120" width="300" height="68.7" fill="#fff6b3" stroke="#d8bd3a" stroke-width="1.5" rx="3"/><text x="570" y="143" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="570" dy="0">Neo4j: CREATE CONSTRAINT … IS UNIQUE. </tspan><tspan x="570" dy="16.900000000000002">ArangoDB: _key, or a unique persistent</tspan><tspan x="570" dy="16.900000000000002">index.</tspan></text></g></svg>
