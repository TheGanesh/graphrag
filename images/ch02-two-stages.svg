E', 'Marker Felt', 'Segoe Print', cursive" font-size="14" fill="#c0392b" text-anchor="start" font-weight="normal"><tspan x="60" dy="0">embed questions and chunks with the</tspan></text><text x="60" y="252" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="14" fill="#c0392b" text-anchor="start" font-weight="normal"><tspan x="60" dy="0">SAME model, or the vectors don't match</tspan></text><text x="300" y="420" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="14" fill="#5b6670" text-anchor="start" font-weight="normal"><tspan x="300" dy="0">the generator can be a smaller model: the retriever already did the knowing</tspan></text></svg>
