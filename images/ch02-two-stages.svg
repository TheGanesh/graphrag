<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d"><title id="t">Vector RAG has two stages</title><desc id="d">Data setup: paper text is chunked, embedded and stored in an ArangoDB chunks collection with a vector index and a search view. Query time: the question is embedded with the same model, the vector index returns the nearest chunks, and the LLM answers from them.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker><marker id="ahc0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#c0392b"/></marker></defs><rect x="1" y="1" width="958" height="468" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Vector RAG has two stages</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">data setup happens once; query time happens on every question</text><text x="40" y="112" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#a87500" text-anchor="start" font-weight="bold"><tspan x="40" dy="0">DATA SETUP</tspan></text><path d="M48,128 L86,128 L100,142 L100,192 L48,192 z" fill="#fff3d4" stroke="#a87500" stroke-width="2" stroke-linejoin="round"/><path d="M86,128 L86,142 L100,142" fill="none" stroke="#a87500" stroke-width="2" stroke-linejoin="round"/><line x1="57" y1="150" x2="90" y2="150" stroke="#a87500" stroke-width="2" stroke-linecap="round" opacity="0.55"/><line x1="57" y1="160" x2="80" y2="160" stroke="#a87500" stroke-width="2" stroke-linecap="round" 