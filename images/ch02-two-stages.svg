ica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="565.0" dy="0">INSERT</tspan></text><path d="M602,125 L602,203 A160.0,13 0 0,0 922,203 L922,125" fill="#e8f4dc" stroke="#4c8a1d" stroke-width="2"/><ellipse cx="762.0" cy="125" rx="160.0" ry="13" fill="#ffffff" stroke="#4c8a1d" stroke-width="2"/><text x="762.0" y="165.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="762.0" dy="0">ArangoDB</tspan></text><text x="762.0" y="182.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="762.0" dy="0">chunks {index, text, embedding} + vector</tspan><tspan x="762.0" dy="16.25">index + search view</tspan></text><text x="40" y="286" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#c4462a" text-anchor="start" font-weight="bold"><tspan x="40" dy="0">QUERY TIME</tspan></text><circle cx="64" cy="314" r="8.8" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><path d="M48.8,344.4 Q48.8,326.0 64,326.0 Q79.2,326.0 79.2,344.4 z" fill="#fde7e1" stroke="#c4462a" stroke-width="2" stroke-linejoin="round"/><rect x="96" y="302" width="150" height="56" rx="12" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><text x="171.0" y="335.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="171.0" dy="0">question</tspan></text><path d="M248.0,330.0 L300.0,330.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="302" y="302" width="160" height="56" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="382.0" y="325.125" font-family="'Helvetica Neue', Helvetica