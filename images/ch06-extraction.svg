<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d"><title id="t">From contract text to graph</title><desc id="d">A contract document is sent to an LLM together with a Pydantic schema; Structured Outputs guarantees JSON matching the schema; one AQL query upserts the contract, organizations, locations and the edges between them.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker></defs><rect x="1" y="1" width="958" height="418" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">From contract text to graph</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">Structured Outputs turn prose into JSON that matches your schema; AQL UPSERTs it into the graph</text><path d="M46,150 L112,150 L126,164 L126,254 L46,254 z" fill="#fff3d4" stroke="#a87500" stroke-width="2" stroke-linejoin="round"/><path d="M112,150 L112,164 L126,164" fill="none" stroke="#a87500" stroke-width="2" stroke-linejoin="round"/><line x1="55" y1="172" x2="116" y2="172" stroke="#a87500" stroke-width="2" stroke-linecap="round" opacity="0.55"/><line x1="55" y1="182" x2="106" y2="182" stroke="#a87500" stroke-width="2" stroke-linecap="round" opacity="0.55"/><line x1="55" y1="192" x2="116" y2="192" stroke="#a87500" stroke-width="2" stroke-linecap="round" opacity="0.55"/><line x1="55" y1="202" x2="106" y2="202" stroke="#a87500" stroke-width="2" stroke-linecap="round" opacity="0.55"/><line x1="55" y1="212" x2="116" y2="212" stroke="#a87500" stroke-width="2" stroke-linecap="round" opacity="0.55"/><line x1="55" y1="222" x2="106" y2="222" stroke="#a87500" stroke-width="2" stroke-linecap="round" opacity="0.55"/><line x1="55" y1="232" x2="116" y2="232" stroke="#a87500" stroke-width="2" stroke-linecap="round" opacity="0.55"/><line x1="55" y1="242" x2="106" y2="242" stroke="#a87500" stroke-width="2" stroke-linecap="round" opacity="0.55"/><text x="86.0" y="272" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="86.0" dy="0">contract.txt</tspan></text><path d="M132.0,202.0 L184.0,202.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><line x1="204.0" y1="153" x2="204.0" y2="160" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="204.0" y1="244" x2="204.0" y2="251" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="242.0" y1="153" x2="242.0" y2="160" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="242.0" y1="244" x2="242.0" y2="251" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="280.0" y1="153" x2="280.0" y2="160" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="280.0" y1="244" x2="280.0" y2="251" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="318.0" y1="153" x2="318.0" y2="160" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="318.0" y1="244" x2="318.0" y2="251" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><rect x="186" y="160" width="150" height="84" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="261.0" y="197.475" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="261.0" dy="0">LLM</tspan></text><text x="261.0" y="218.92499999999998" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="261.0" dy="0">+ Pydantic schema</tspan></text><path d="M320,169 l2.5,6 6,2.5 -6,2.5 -2.5,6 -2.5,-6 -6,-2.5 6,-2.5 z" fill="#6847c0" opacity="0.8"/><rect x="150" y="268" width="230" height="79.8" rx="10" fill="#ffffff" stroke="#b9b2a2" stroke-width="1.5"/><text x="158" y="287" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">class Contract(BaseModel):</text><text x="158" y="302.95" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">  contract_type: Literal[...]</text><text x="158" y="318.9" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">  parties: list[Organization]</text><text x="158" y="334.84999999999997" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">  end_date: Optional[str]</text><path d="M338.0,202.0 L386.0,202.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="362.0" y="206.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="362.0" dy="0">JSON</tspan></text><rect x="388" y="110" width="270" height="147.6" rx="10" fill="#ffffff" stroke="#b9b2a2" stroke-width="1.5"/><text x="398" y="131" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">{ &quot;contract_type&quot;: &quot;Licensing</text><text x="398" y="146.95" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">    Agreement&quot;,</text><text x="398" y="162.89999999999998" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">  &quot;parties&quot;: [</text><text x="398" y="178.84999999999997" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">    { &quot;name&quot;: &quot;Northwind…&quot;,</text><text x="398" y="194.79999999999995" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">      &quot;role&quot;: &quot;licensor&quot;,</text><text x="398" y="210.74999999999994" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">      &quot;location&quot;: {…} }, …],</text><text x="398" y="226.69999999999993" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">  &quot;effective_date&quot;: &quot;2025-03-01&quot;,</text><text x="398" y="242.64999999999992" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">  &quot;end_date&quot;: &quot;2027-02-28&quot; }</text><path d="M660.0,202.0 L708.0,202.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="684.0" y="206.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="684.0" dy="0">UPSERT</tspan></text><path d="M710,163 L710,241 A105.0,13 0 0,0 920,241 L920,163" fill="#e8f4dc" stroke="#4c8a1d" stroke-width="2"/><ellipse cx="815.0" cy="163" rx="105.0" ry="13"