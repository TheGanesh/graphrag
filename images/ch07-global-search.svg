<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d"><title id="t">Global search = map-reduce over community reports</title><desc id="d">Community reports with a rating above a threshold are packed into batches. MAP: each batch and the question go to an LLM that returns key points with importance scores and report references. REDUCE: points with score above zero are sorted by importance and a final LLM call writes the answer, keeping the references.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker></defs><rect x="1" y="1" width="958" height="458" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Global search = map-reduce over community reports</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">for broad questions no single chunk can answer</text><rect x="40" y="110" width="200" height="54" rx="12" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><text x="140.0" y="131.15" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="140.0" dy="0">What is this</tspan></text><text x="140.0" y="150.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="140.0" dy="0">story about?</tspan></text><path d="M40,213 L40,277 A100.0,13 0 0,0 240,277 L240,213" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><ellipse cx="140.0" cy="213" rx="100.0" ry="13" fill="#ffffff" stroke="#2b67ad" stroke-width="2"/><text x="140.0" y="246.25" font