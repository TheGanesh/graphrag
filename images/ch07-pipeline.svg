<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d"><title id="t">Microsoft-style GraphRAG, end to end</title><desc id="d">Indexing: text chunks, LLM extraction of entities and relationships with descriptions, LLM summarization of duplicate descriptions, community detection, and an LLM-written report per community. Querying: global search map-reduces over community reports; local search starts from the entities most similar to the question and expands to related chunks, relationships and reports.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker><marker id="ahb9b2a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#b9b2a2"/></marker></defs><rect x="1" y="1" width="958" height="498" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Microsoft-style GraphRAG, end to end</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">indexing builds layers of LLM-written summaries; querying reads them back</text><text x="40" y="112" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#4c8a1d" text-anchor="start" font-weight="bold"><tspan x="40" dy="0">INDEXING  (expensive, once)</tspan></text><rect x="40" y="128" width="160" height="84" rx="12" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="120.0" y="165.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="120.0" dy="0">chunks</tspan></text><text x="120.0" y="186.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="120.0" dy="0">~1,000 chars</tspan></text><rect x="222" y="128" width="160" height="84" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="302.0" y="158.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="302.0" dy="0">extract</tspan></text><text x="302.0" y="178.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="302.0" dy="0">entities + relations</tspan><tspan x="302.0" dy="15.0">with descriptions</tspan></text><path d="M202.0,170.0 L220.0,170.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="404" y="128" width="160" height="84" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="484.0" y="158.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="484.0" dy="0">summarize</tspan></text><text x="484.0" y="178.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="484.0" dy="0">merge duplicate</tspan><tspan x="484.0" dy="15.0">descriptions</tspan></text><path d="M384.0,170.0 L402.0,170.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="586" y="128" width="160" height="84" rx="12" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><text x="666.0" y="165.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="666.0" dy="0">communities</tspan></text><text x="666.0" y="186.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="666.0" dy="0">Louvain / Leiden</tspan></text><path d="M566.0,170.0 L584.0,170.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="768" y="128" width="160" height="84" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="848.0" y="158.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="848.0" dy="0">reports</tspan></text><text x="848.0" y="178.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="848.0" dy="0">title, summary,</tspan><tspan x="848.0" dy="15.0">rating, findings</tspan></text><path d="M748.0,170.0 L766.0,170.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><path d="M330,262.8 L330,317.2 A150.0,12.8 0 0,0 630,317.2 L630,262.8" fill="#e8f4dc" stroke="#4c8a1d" stroke-width="2"/><ellipse cx="480.0" cy="262.8" rx="150.0" ry="12.8" fill="#ffffff" stroke="#4c8a1d" stroke-width="2"/><text x="480.0" y="291.05" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="480.0" dy="0">ArangoDB</tspan></text><text x="480.0" y="308.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="480.0" dy="0">chunks · entities · communities + 4 edge</tspan><tspan x="480.0" dy="16.25">collections</tspan></text><path d="M120.0,214.0 L352.6,248.0" fill="none" stroke="#b9b2a2" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ahb9b2a2)"/><path d="M302.0,214.0 L416.3,248.0" fill="none" stroke="#b9b2a2" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ahb9b2a2)"/><path d="M484.0,214.0 L480.0,248.0" fill="none" stroke="#b9b2a2" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ahb9b2a2)"/><path d="M666.0,214.0 L543.7,248.0" fill="none" stroke="#b9b2a2" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ahb9b2a2)"/><path d="M848.0,214.0 L607.4,248.0" fill="none" stroke="#b9b2a2" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ahb9b2a2)"/><text x="40" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#c4462a" text-anchor="start" font-weight="bold"><tspan x="40" dy="0">QUERYING  (every question)</tspan></text><rect x="40" y="388" width="430" height="84" rx="12" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><text x="255.0" y="425.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="255.0" dy="0">Global search</tspan></text><text x="255.0" y="446.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="255.0" dy="0">map-reduce over community reports - &quot;What is this story about?&quot;</tspan></text><rect x="490" y="388" width="430" height="84" rx="12" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><text x="705.0" y="418.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="705.0" dy="0">Local search</tspan></text><text x="705.0" y="438.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="705.0" dy="0">vector-find entities, expand to chunks, relationships, reports -</tspan><tspan x="705.0" dy="15.0">&quot;Who is Ulysses?&quot;</tspan></text><path d="M380.0,332.0 L255.0,386.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><path d="M580.0,332.0 L705.0,386.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/></svg>
