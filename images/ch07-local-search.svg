<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d"><title id="t">Local search = start at the right entities, then expand</title><desc id="d">The question is embedded and the vector index returns the top-k entities. From them, one AQL query collects the chunks that mention them (ranked by number of mentions), their community reports (ranked by matched entities and rating), the summarized relationships among them (ranked by rank and weight), and the entity summaries; the tables go into the prompt.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker><marker id="ah8b8578" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#8b8578"/></marker><marker id="ah1e8449" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1e8449"/></marker></defs><rect x="1" y="1" width="958" height="478" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Local search = start at the right entities, then expand</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">one AQL query gathers four kinds of context, each ranked and capped</text><rect x="40" y="110" width="170" height="54" rx="12" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><text x="125.0" y="131.15" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="125.0" dy="0">Who is</tspan></text><text x="125.0" y="150.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="125.0" dy="0">Ulysses?</tspan></text><path d="M125.0,166.0 L125.0,206.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="155.0" y="190.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="155.0" dy="0">embed</tspan></text><rect x="40" y="208" width="170" height="70" rx="12" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><text x="125.0" y="230.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="125.0" dy="0">vector index</tspan></text><text x="125.0" y="250.20000000000002" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="125.0" dy="0">APPROX_NEAR_COSINE on</tspan><tspan x="125.0" dy="15.0">entities</tspan></text><path d="M212.0,243.0 L270.0,243.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><circle cx="310" cy="200" r="16" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><circle cx="350" cy="250" r="16" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><circle cx="300" cy="296" r="16" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><text x="325" y="340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="325" dy="0">top-k entities</tspan></text><rect x="430" y="96" width="270" height="66" rx="12" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="565.0" y="124.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="565.0" dy="0">Sources</tspan></text><text x="565.0" y="145.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="565.0" dy="0">chunks that mention them · by # mentions</tspan></text><path d="M370.0,248.0 L428.0,129.0" fill="none" stroke="#8b8578" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah8b8578)"/><path d="M702.0,129.0 L772.0,262.0" fill="none" stroke="#8b8578" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah8b8578)"/><rect x="430" y="180" width="270" height="66" rx="12" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><text x="565.0" y="208.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="565.0" dy="0">Reports</tspan></text><text x="565.0" y="229.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="565.0" dy="0">their communities · by matches, rating</tspan></text><path d="M370.0,248.0 L428.0,213.0" fill="none" stroke="#8b8578" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah8b8578)"/><path d="M702.0,213.0 L772.0,262.0" fill="none" stroke="#8b8578" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah8b8578)"/><rect x="430" y="264" width="270" height="66" rx="12" fill="#e8f4dc" stroke="#4c8a1d" stroke-width="2"/><text x="565.0" y="292.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="565.0" dy="0">Relationships</tspan></text><text x="565.0" y="313.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="565.0" dy="0">summarized edges among them · by rank</tspan></text><path d="M370.0,248.0 L428.0,297.0" fill="none" stroke="#8b8578" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah8b8578)"/><path d="M702.0,297.0 L772.0,262.0" fill="none" stroke="#8b8578" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah8b8578)"/><rect x="430" y="348" width="270" height="66" rx="12" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><text x="565.0" y="376.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="565.0" dy="0">Entities</tspan></text><text x="565.0" y="397.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="565.0" dy="0">their summaries · all k</tspan></text><path d="M370.0,248.0 L428.0,381.0" fill="none" stroke="#8b8578" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah8b8578)"/><path d="M702.0,381.0 L772.0,262.0" fill="none" stroke="#8b8578" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah8b8578)"/><line x1="792.0" y1="223" x2="792.0" y2="230" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="792.0" y1="294" x2="792.0" y2="301" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="830.0" y1="223" x2="830.0" y2="230" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="830.0" y1="294" x2="830.0" y2="301" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="868.0" y1="223" x2="868.0" y2="230" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="868.0" y1="294" x2="868.0" y2="301" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="906.0" y1="223" x2="906.0" y2="230" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="906.0" y1="294" x2="906.0" y2="301" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><rect x="774" y="230" width="150" height="64" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="849.0" y="257.475" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="849.0" dy="0">LLM</tspan></text><text x="849.0" y="278.925" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="849.0" dy="0">context tables</tspan></text><path d="M908,239 l2.5,6 6,2.5 -6,2.5 -2.5,6 -2.5,-6 -6,-2.5 6,-2.5 z" fill="#6847c0" opacity="0.8"/><path d="M849.0,228.0 L849.0,166.0" fill="none" stroke="#1e8449" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1e8449)"/><rect x="774" y="116" width="150" height="48" rx="12" fill="#e3f5ea" stroke="#1e8449" stroke-width="2"/><text x="849.0" y="136.025" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="849.0" dy="0">answer</tspan></text><text x="849.0" y="155.27500000000003" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="849.0" dy="0">with [Data: …] refs</tspan></text><text x="565" y="446" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic"><tspan x="565" dy="0">each list is capped: top_chunks, top_communities, top_inside_rels</tspan></text><text x="40" y="470" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal"><tspan x="40" dy="0">the graph supplies the CONTEXT around the entities, not just the most similar text</tspan></text></svg>
