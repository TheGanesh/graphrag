<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d"><title id="t">Where to measure a RAG pipeline</title><desc id="d">The pipeline goes from user question to tool selection, to retrieved context, to the generated answer. Evaluation checkpoints: was the right tool chosen, is the retrieved context relevant and complete, is the answer faithful to the context and correct versus the ground truth, and how does the whole pipeline perform end to end including latency.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker></defs><rect x="1" y="1" width="958" height="428" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Where to measure a RAG pipeline</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">four checkpoints - test them separately and end to end</text><circle cx="60" cy="200" r="9.9" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><path d="M42.9,234.2 Q42.9,213.5 60,213.5 Q77.1,213.5 77.1,234.2 z" fill="#fde7e1" stroke="#c4462a" stroke-width="2" stroke-linejoin="round"/><rect x="96" y="186" width="130" height="54" rx="12" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><text x="161.0" y="218.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="161.0" dy="0">question</tspan></text><path d="M228.0,213.0 L278.0,213.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><line x1="298.0" y1="173" x2="298.0" y2="180" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="298.0" y1="246" x2="298.0" y2="253" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="329.3333333333333" y1="173" x2="329.3333333333333" y2="180" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="329.3333333333333" y1="246" x2="329.3333333333333" y2="253" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="360.6666666666667" y1="173" x2="360.6666666666667" y2="180" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="360.6666666666667" y1="246" x2="360.6666666666667" y2="253" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="392.0" y1="173" x2="392.0" y2="180" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="392.0" y1="246" x2="392.0" y2="253" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><rect x="280" y="180" width="130" height="66" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="345.0" y="208.475" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="345.0" dy="0">router</tspan></text><text x="345.0" y="229.92499999999998" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="345.0" dy="0">picks a tool</tspan></text><path d="M394,189 l2.5,6 6,2.5 -6,2.5 -2.5,6 -2.5,-6 -6,-2.5 6,-2.5 z" fill="#6847c0" opacity="0.8"/><path d="M412.0,213.0 L462.0,213.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="464" y="180" width="150" height="66" rx="12" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><text x="539.0" y="208.125" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="539.0" dy="0">retriever</tspan></text><text x="539.0" y="228.525" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif