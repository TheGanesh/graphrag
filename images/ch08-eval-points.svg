ue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="884.0" dy="0">answer</tspan></text><path d="M918,189 l2.5,6 6,2.5 -6,2.5 -2.5,6 -2.5,-6 -6,-2.5 6,-2.5 z" fill="#6847c0" opacity="0.8"/><line x1="345" y1="256" x2="345" y2="300" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/><text x="345" y="322" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold"><tspan x="345" dy="0">1 · right tool?</tspan></text><text x="345" y="342" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="345" dy="0">tool-selection tests</tspan></text><line x1="541" y1="256" x2="541" y2="300" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/><text x="541" y="322" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold"><tspan x="541" dy="0">2 · context recall</tspan></text><text x="541" y="342" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="541" dy="0">did we fetch it all?</tspan></text><line x1="728" y1="256" x2="728" y2="300" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/><text x="728" y="322" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold"><tspan x="728" dy="0">3 · faithfulness</tspan></text><text x="728" y="342" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="728" dy="0">answer ⊂ context?</tspan></text><line x1="884" y1="256" x2="884" y2="300" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/><text x="884" y="322" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold"><tspan x="884" dy="0">4 · correctness</tspan></text><text x="884" y="342" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="884" dy="0">answer = truth?</tspan></text><path d="M96,140 Q520,70 934,140" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5"/><text x="430" y="118" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal"><tspan x="430" dy="0">end to end: answer quality + latency</tspan></text><text x="60" y="400" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="14" fill="#5b6670" text-anchor="start" font-weight="normal"><tspan x="60" dy="0">Test generation separately: does the LLM answer correctly when GIVEN the right context?</tspan></text></svg>
