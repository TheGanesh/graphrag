<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d"><title id="t">Three metrics, one trick: break text into statements</title><desc id="d">Context recall: statements of the ground truth checked against the retrieved context. Faithfulness: statements of the answer checked against the retrieved context. Answer correctness: answer statements compared with ground-truth statements as true positives, false positives and false negatives, combined into an F1 score.</desc><defs></defs><rect x="1" y="1" width="958" height="468" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Three metrics, one trick: break text into statements</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">then check each statement against something</text><rect x="40" y="92" width="270" height="350" rx="14" fill="#ffffff" stroke="#e3d9c6" stroke-width="2"/><text x="175" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="175" dy="0">Context recall</tspan></text><text x="175" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="175" dy="0">ground-truth statements</tspan></text><text x="175" y="176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2b67ad" text-anchor="middle" font-weight="bold"><tspan x="175" dy="0">found in the context?</tspan></text><rect x="56" y="196" width="238" height="38" rx="12" fill="#e3f5ea" stroke="#1e8449" stroke-width="2"/><text x="175.0" y="219.20000000000002" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="175.0" dy="0">Tom Hanks acted in 12 movies</tspan></text><rect x="56" y="246" width="238" height="38" rx="12" fill="#e3f5ea" stroke="#1e8449" stroke-width="2"/><text x="175.0" y="269.2" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="175.0" dy="0">one was Cast Away</tspan></text><rect x="56" y="296" width="238" height="38" rx="12" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/><text x="175.0" y="319.2" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="175.0" dy="0">one was Apollo 13</tspan></text><text x="175" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="175" dy="0">2 / 3 = 0.67</tspan></text><text x="175" y="402" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="normal"><tspan x="175" dy="0">retriever missed something</tspan></text><rect x="350" y="92" width="270" height="350" rx="14" fill="#ffffff" stroke="#e3d9c6" stroke-width="2"/><text x="485" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="485" dy="0">Faithfulness</tspan></text><text x="485" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="485" dy="0">answer statements</tspan></text><text x="485" y="176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2b67ad" text-anchor="middle" font-weight="bold"><tspan x="485" dy="0">supported by the context?</tspan></text><rect x="366" y="196" width="238" height="38" rx="12" fill="#e3f5ea" stroke="#1e8449" stroke-width="2"/><text x="485.0" y="219.20000000000002" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="485.0" dy="0">Hanks made 12 movies</tspan></text><rect x="366" y="246" width="238" height="38" rx="12" fill="#e3f5ea" stroke="#1e8449" stroke-width="2"/><text x="485.0" y="269.2" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="485.0" dy="0">including Cast Away</tspan></text><rect x="366" y="296" width="238" height="38" rx="12" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/><text x="485.0" y="319.2" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="485.0" dy="0">he won two Oscars</tspan></text><text x="485" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="485" dy="0">2 / 3 = 0.67</tspan></text><text x="485" y="402" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="normal"><tspan x="485" dy="0">the LLM added a claim</tspan></text><rect x="660" y="92" width="270" height="350" rx="14" fill="#ffffff" stroke="#e3d9c6" stroke-width="2"/><text x="795" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="795" dy="0">Answer correctness</tspan></text><text x="795" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="795" dy="0">answer vs ground truth</tspan></text><text x="795" y="176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2b67ad" text-anchor="middle" font-weight="bold"><tspan x="795" dy="0">TP · FP · FN</tspan></text><rect x="676" y="196" width="238" height="38" rx="12" fill="#e3f5ea" stroke="#1e8449" stroke-width="2"/><text x="795.0" y="219.20000000000002" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="795.0" dy="0">12 movies  → TP</tspan></text><rect x="676" y="246" width="238" height="38" rx="12" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/><text x="795.0" y="269.2" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="795.0" dy="0">two Oscars → FP</tspan></text><rect x="676" y="296" width="238" height="38" rx="12" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/><text x="795.0" y="319.2" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="795.0" dy="0">Apollo 13 missing → FN</tspan></text><text x="795" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="795" dy="0">TP/(TP+½(FP+FN)) = 0.5</tspan></text><text x="795" y="402" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="normal"><tspan x="795" dy="0">right, wrong and missing</tspan></text></svg>
