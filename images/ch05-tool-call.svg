<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d"><title id="t">Who does what in a tool call</title><desc id="d">Sequence: the app sends the question and tool descriptions to the LLM; the LLM replies with a tool call naming a function and JSON arguments; the app runs the matching AQL query with bind parameters; ArangoDB returns rows; the app sends the rows back as context; the LLM writes the final answer.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker></defs><rect x="1" y="1" width="958" height="468" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Who does what in a tool call</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">the model proposes, your application disposes</text><rect x="70" y="96" width="160" height="42" rx="12" fill="#ffffff" stroke="#3d4852" stroke-width="2"/><text x="150.0" y="122.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="150.0" dy="0">your app</tspan></text><line x1="150" y1="140" x2="150" y2="450" stroke="#cfc6b4" stroke-width="2" stroke-dasharray="5 6"/><rect x="400" y="96" width="160" height="42" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="480.0" y="122.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="480.0" dy="0">LLM</tspan></text><line x1="480" y1="140" x2="480" y2="450" stroke="#cfc6b4" stroke-width="2" stroke-dasharray="5 6"/><rect x="730" y="96" width="160" height="42" rx="12" fill="#e8f4dc" stroke="#4c8a1d" stroke-width="2"/><text x="810.0" y="122.25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="810.0" dy="0">ArangoDB</tspan></text><line x1="810" y1="140" x2="810" y2="450" stroke="#cfc6b4" stroke-width="2" stroke-dasharray="5 6"/><path d="M150.0,175.0 L480.0,175.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="315.0" y="165.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="315.0" dy="0">question + tool descriptions (JSON schema)</tspan></text><path d="M480.0,220.0 L150.0,220.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="315.0" y="210.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="315.0" dy="0">tool_calls: movie_info_by_title({&quot;title&quot;: &quot;The Matrix&quot;})</tspan></text><path d="M150.0,265.0 L810.0,265.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="480.0" y="255.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="480.0" dy="0">AQL template + @title bind parameter</tspan></text><path d="M810.0,310.0 L150.0,310.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="480.0" y="300.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="480.0" dy="0">rows: title, cast, directors</tspan></text><path d="M150.0,355.0 L480.0,355.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="315.0" y="345.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="315.0" dy="0">&quot;For the question … we have the answer …&quot;</tspan></text><path d="M480.0,400.0 L150.0,400.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="315.0" y="390.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="315.0" dy="0">final answer (grounded in the rows)</tspan></text><g transform="rotate(1.5 660.0 414.35)"><rect x="543" y="384" width="240" height="68.7" fill="#000" opacity="0.06" rx="3"/><rect x="540" y="380" width="240" height="68.7" fill="#fff6b3" stroke="#d8bd3a" stroke-width="1.5" rx="3"/><text x="550" y="403" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="550" dy="0">your app:</tspan><tspan x="550" dy="16.900000000000002">json.loads(arguments) → call</tspan><tspan x="550" dy="16.900000000000002">the Python function</tspan></text></g></svg>
