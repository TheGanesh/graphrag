<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d"><title id="t">Which retriever for which question?</title><desc id="d">A decision guide: fuzzy facts in text use vector or hybrid search; exact terms use BM25 hybrid; answers needing more context than a chunk use the parent document retriever; counting, filtering, ranking and multi-hop questions use AQL templates or text2aql; everything about one entity uses local search; themes across the corpus use global search; mixed questions go through an agentic router.</desc><defs><marker id="ahb9b2a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#b9b2a2"/></marker><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker></defs><rect x="1" y="1" width="958" height="518" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Which retriever for which question?</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">start from what the answer needs - not from the tool you like</text><rect x="30" y="220" width="210" height="90" rx="12" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><text x="135.0" y="261.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="135.0" dy="0">What does the</tspan><tspan x="135.0" dy="19.2">answer need?</tspan></text><text x="300" y="124" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="300" dy="0">a fact stated in some text</tspan></text><path d="M242.0,265.0 L292.0,119.0" fill="none" stroke="#b9b2a2" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ahb9b2a2)"/><path d="M560.0,119.0 L600.0,119.0" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="602" y="96" width="250" height="44" rx="12" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="727.0" y="122.89999999999999" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="727.0" dy="0">vector / hybrid search</tspan></text><text x="868" y="124" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="start" font-weight="normal" font-style="italic"><tspan x="868" dy="0">ch. 2</tspan></text><text x="300" y="182" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="300" dy="0">exact names, codes, rare words</tspan></text><path d="M242.0,265.0 L292.0,177.0" fill="none" stroke="#b9b2a2" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ahb9b2a2)"/><path d="M560.0,177.0 L600.0,177.0" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="602" y="154" width="250" height="44" rx="12" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="727.0" y="180.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="727.0" dy="0">hybrid: + BM25 view</tspan></text><text x="868" y="182" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="start" font-weight="normal" font-style="italic"><tspan x="868" dy="0">ch. 2</tspan></text><text x="300" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="300" dy="0">more context than one chunk</tspan></text><path d="M242.0,265.0 L292.0,235.0" fill="none" stroke="#b9b2a2" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ahb9b2a2)"/><path d="M560.0,235.0 L600.0,235.0" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="602" y="212" width="250" height="44" rx="12" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="727.0" y="238.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="727.0" dy="0">parent document retriever</tspan></text><text x="868" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="start" font-weight="normal" font-style="italic"><tspan x="868" dy="0">ch. 3</tspan></text><text x="300" y="298" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="300" dy="0">count · filter · rank · multi-hop</tspan></text><path d="M242.0,265.0 L292.0,293.0" fill="none" stroke="#b9b2a2" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ahb9b2a2)"/><path d="M560.0,293.0 L600.0,293.0" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="602" y="270" width="250" height="44" rx="12" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><text x="727.0" y="296.90000000000003" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="727.0" dy="0">AQL template or text2aql</tspan></text><text x="868" y="298" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="start" font-weight="normal" font-style="italic"><tspan x="868" dy="0">ch. 4-5</tspan></text><text x="300" y="356" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="300" dy="0">everything about one entity</tspan></text><path d="M242.0,265.0 L292.0,351.0" fill="none" stroke="#b9b2a2" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ahb9b2a2)"/><path d="M560.0,351.0 L600.0,351.0" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="602" y="328" width="250" height="44" rx="12" fill="#e8f4dc" stroke="#4c8a1d" stroke-width="2"/><text x="727.0" y="354.90000000000003" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="727.0" dy="0">local search</tspan></text><text x="868" y="356" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="start" font-weight="normal" font-style="italic"><tspan x="868" dy="0">ch. 7</tspan></text><text x="300" y="414" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="300" dy="0">themes across the whole corpus</tspan></text><path d="M242.0,265.0 L292.0,409.0" fill="none" stroke="#b9b2a2" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ahb9b2a2)"/><path d="M560.0,409.0 L600.0,409.0" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="602" y="386" width="250" height="44" rx="12" fill="#e8f4dc" stroke="#4c8a1d" stroke-width="2"/><text x="727.0" y="412.90000000000003" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="727.0" dy="0">global search</tspan></text><text x="868" y="414" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="start" font-weight="normal" font-style="italic"><tspan x="868" dy="0">ch. 7</tspan></text><text x="300" y="472" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="300" dy="0">a mix of the above</tspan></text><path d="M242.0,265.0 L292.0,467.0" fill="none" stroke="#b9b2a2" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ahb9b2a2)"/><path d="M560.0,467.0 L600.0,467.0" fill="none" stroke="#1f2933" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="602" y="444" width="250" height="44" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="727.0" y="470.90000000000003" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="727.0" dy="0">agentic router + tools</tspan></text><text x="868" y="472" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="start" font-weight="normal" font-style="italic"><tspan x="868" dy="0">ch. 5</tspan></text></svg>
