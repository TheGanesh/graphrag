<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d"><title id="t">Sliding-window chunking</title><desc id="d">A long text strip is cut into windows of about 500 characters. Each window starts about 40 characters before the previous one ended, so text on a boundary appears in both chunks, and window edges are moved to the nearest space so words are not split.</desc><defs><marker id="ahc0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#c0392b"/></marker></defs><rect x="1" y="1" width="958" height="328" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Sliding-window chunking</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">fixed-size windows that overlap a little and only cut at spaces</text><rect x="40" y="160" width="880" height="36" rx="6" fill="#fff" stroke="#b9b2a2" stroke-width="1.5"/><rect x="48" y="174" width="29" height="8" rx="3" fill="#d8d1c2"/><rect x="85" y="174" width="22" height="8" rx="3" fill="#d8d1c2"/><rect x="115" y="174" width="37" height="8" rx="3" fill="#d8d1c2"/><rect x="160" y="174" width="44" height="8" rx="3" fill="#d8d1c2"/><rect x="212" y="174" width="18" height="8" rx="3" fill="#d8d1c2"/><rect x="238" y="174" width="14" height="8" rx="3" fill="#d8d1c2"/><rect x="260" y="174" width="44" height="8" rx="3" fill="#d8d1c2"/><rect x="312" y="174" width="30" height="8" rx="3" fill="#d8d1c2"/><rect x="350" y="174" width="28" height="8" rx="3" fill="#d8d1c2"/><rect x="386" y="174" width="26" height="8" rx="3" fill="#d8d1c2"/><rect x="420" y="174" width="44" height="8" rx="3" fill="#d8d1c2"/><rect x="472" y="174" width="44" height="8" rx="3" fill="#d8d1c2"/><rect x="524" y="174" width="39" height="8" rx="3" fill="#d8d1c2"/><rect x="571" y="174" width="23" height="8" rx="3" fill="#d8d1c2"/><rect x="602" y="174" width="28" height="8" rx="3" fill="#d8d1c2"/><rect x="638" y="174" width="23" height="8" rx="3" fill="#d8d1c2"/><rect x="669" y="174" width="38" height="8" rx="3" fill="#d8d1c2"/><rect x="715" y="174" width="14" height="8" rx="3" fill="#d8d1c2"/><rect x="737" y="174" width="18" height="8" rx="3" fill="#d8d1c2"/><rect x="763" y="174" width="24" height="8" rx="3" fill="#d8d1c2"/><rect x="795" y="174" width="16" height="8" rx="3" fill="#d8d1c2"/><rect x="819" y="174" width="33" height="8" rx="3" fill="#d8d1c2"/><rect x="860" y="174" width="15" height="8" rx="3" fill="#d8d1c2"/><rect x="883" y="174" width="25" height="8" rx="3" fill="#d8d1c2"/><rect x="40" y="112" width="320" height="38" rx="8" fill="#fff3d4" stroke="#a87500" stroke-width="2" opacity="0.95"/><text x="200.0" y="137" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="200.0" dy="0">chunk 1</tspan></text><line x1="40" y1="154" x2="40" y2="202" stroke="#a87500" stroke-width="2" stroke-dasharray="4 3"/><line x1="360" y1="154" x2="360" y2="202" stroke="#a87500" stroke-width="2" stroke-dasharray="4 3"/><rect x="318" y="212" width="332" height="38" rx="8" fill="#e4effb" stroke="#2b67ad" stroke-width="2" opacity="0.95"/><text x="484.0" y="237" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="484.0" dy="0">chunk 2</tspan></text><line x1="318" y1="154" x2="318" y2="202" stroke="#2b67ad" stroke-width="2" stroke-dasharray="4 3"/><line x1="650" y1="154" x2="650" y2="202" stroke="#2b67ad" stroke-width="2" stroke-dasharray="4 3"/><rect x="608" y="112" width="312" height="38" rx="8" fill="#e8f4dc" stroke="#4c8a1d" stroke-width="2" opacity="0.95"/><text x="764.0" y="137" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="764.0" dy="0">chunk 3</tspan></text><line x1="608" y1="154" x2="608" y2="202" stroke="#4c8a1d" stroke-width="2" stroke-dasharray="4 3"/><line x1="920" y1="154" x2="920" y2="202" stroke="#4c8a1d" stroke-width="2" stroke-dasharray="4 3"/><rect x="318" y="160" width="42" height="36" fill="#c0392b" opacity="0.18"/><rect x="608" y="160" width="42" height="36" fill="#c0392b" opacity="0.18"/><text x="339" y="300" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="normal"><tspan x="339" dy="0">overlap (~40 chars): a sentence on the</tspan></text><text x="339" y="318" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="normal"><tspan x="339" dy="0">border lands in both chunks</tspan></text><path d="M339.0,284.0 L339.0,252.0" fill="none" stroke="#c0392b" stroke-width="2" stroke-linecap="round" marker-end="url(#ahc0392b)"/><text x="800" y="300" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="normal"><tspan x="800" dy="0">edges snap to spaces: no half-words</tspan></text><path d="M800.0,284.0 Q720.8,287.6 650.0,252.0" fill="none" stroke="#c0392b" stroke-width="2" stroke-linecap="round" marker-end="url(#ahc0392b)"/><text x="40" y="98" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="start" font-weight="normal" font-style="italic"><tspan x="40" dy="0">size ≈ 500 characters</tspan></text></svg>
