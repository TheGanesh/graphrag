<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d"><title id="t">Same graph, different vocabulary</title><desc id="d">A Neo4j node with a label and properties becomes a JSON document in a document collection, identified by _key and _id. A typed relationship with properties becomes a document in an edge collection with _from and _to pointing at the two vertex documents.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker><marker id="ah4c8a1d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#4c8a1d"/></marker></defs><rect x="1" y="1" width="958" height="428" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Same graph, different vocabulary</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">how the book's Neo4j property graph maps onto ArangoDB</text><text x="240" y="106" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="240" dy="0">Neo4j / Cypher</tspan></text><text x="710" y="106" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="710" dy="0">ArangoDB / AQL</tspan></text><path d="M154.0,190.0 L324.0,190.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><text x="239.0" y="182.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="239.0" dy="0">ACTED_IN {roles}</tspan></text><circle cx="120" cy="190" r="34" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><text x="120" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="120" dy="0">:Person</tspan></text><circle cx="360" cy="190" r="34" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="360" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="360" dy="0">:Movie</tspan></text><text x="120" y="262" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="120" dy="0">{name: 'Tom Hanks'}</tspan></text><text x="360" y="262" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="360" dy="0">{title: 'Cast Away'}</tspan></text><rect x="520" y="130" width="200" height="81.8" rx="10" fill="#ffffff" stroke="#b9b2a2" stroke-width="1.5"/><text x="529" y="150" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">// persons</text><text x="529" y="165.95" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">{ &quot;_key&quot;: &quot;Tom_Hanks&quot;,</text><text x="529" y="181.89999999999998" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">  &quot;_id&quot;: &quot;persons/Tom_Hanks&quot;,</text><text x="529" y="197.84999999999997" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">  &quot;name&quot;: &quot;Tom Hanks&quot; }</text><rect x="740" y="130" width="200" height="81.8" rx="10" fill="#ffffff" stroke="#b9b2a2" stroke-width="1.5"/><text x="749" y="150" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">// movies</text><text x="749" y="165.95" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">{ &quot;_key&quot;: &quot;Cast_Away&quot;,</text><text x="749" y="181.89999999999998" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">  &quot;_id&quot;: &quot;movies/Cast_Away&quot;,</text><text x="749" y="197.84999999999997" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">  &quot;title&quot;: &quot;Cast Away&quot; }</text><rect x="600" y="262" width="270" height="81.8" rx="10" fill="#ffffff" stroke="#b9b2a2" stroke-width="1.5"/><text x="609" y="282" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">// acted_in  (edge collection)</text><text x="609" y="297.95" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">{ &quot;_from&quot;: &quot;persons/Tom_Hanks&quot;,</text><text x="609" y="313.9" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">  &quot;_to&quot;: &quot;movies/Cast_Away&quot;,</text><text x="609" y="329.84999999999997" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">  &quot;roles&quot;: [&quot;Chuck Noland&quot;] }</text><path d="M640.0,260.0 L625.0,222.0" fill="none" stroke="#4c8a1d" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah4c8a1d)"/><path d="M830.0,260.0 L840.0,222.0" fill="none" stroke="#4c8a1d" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah4c8a1d)"/><text x="196" y="318" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="normal"><tspan x="196" dy="0">node label</tspan></text><text x="220" y="318" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="normal"><tspan x="220" dy="0">→</tspan></text><text x="244" y="318" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#4c8a1d" text-anchor="start" font-weight="bold"><tspan x="244" dy="0">document collection</tspan></text><text x="196" y="344" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="normal"><tspan x="196" dy="0">relationship type</tspan></text><text x="220" y="344" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="normal"><tspan x="220" dy="0">→</tspan></text><text x="244" y="344" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#4c8a1d" text-anchor="start" font-weight="bold"><tspan x="244" dy="0">edge collection</tspan></text><text x="196" y="370" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="normal"><tspan x="196" dy="0">property</tspan></text><text x="220" y="370" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="normal"><tspan x="220" dy="0">→</tspan></text><text x="244" y="370" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#4c8a1d" text-anchor="start" font-weight="bold"><tspan x="244" dy="0">attribute (JSON)</tspan></text><text x="196" y="396" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="normal"><tspan x="196" dy="0">node id</tspan></text><text x="220" y="396" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="normal"><tspan x="220" dy="0">→</tspan></text><text x="244" y="396" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#4c8a1d" text-anchor="start" font-weight="bold"><tspan x="244" dy="0">_id = collection/_key</tspan></text></svg>
