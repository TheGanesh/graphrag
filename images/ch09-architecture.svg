<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="t d"><title id="t">A reference architecture for GraphRAG on ArangoDB</title><desc id="d">Sources flow through ingestion (chunk, embed, extract with an LLM, resolve entities, summarize, detect communities) into ArangoDB, which stores documents, graph edges, a vector index and an ArangoSearch view. Retrievers (vector and hybrid, parent document, AQL templates, text2aql, local and global search) are chosen by an agent with a router and critic; the LLM answers; an evaluation loop with AQL ground truth feeds improvements back. Tools can also be exposed over MCP.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker><marker id="ahc0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#c0392b"/></marker></defs><rect x="1" y="1" width="958" height="528" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">A reference architecture for GraphRAG on ArangoDB</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">everything in this guide, in one picture</text><rect x="30" y="100" width="150" height="120" rx="12" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="105.0" y="147.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="105.0" dy="0">Sources</tspan></text><text x="105.0" y="167.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="105.0" dy="0">PDFs, contracts,</tspan><tspan x="105.0" dy="16.25">books, wikis, tables</tspan></text><path d="M182.0,160.0 L220.0,160.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="222" y="96" width="250" height="128" rx="14" fill="#ffffff" stroke="#e3d9c6" stroke-width="2"/><text x="347" y="120" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="347" dy="0">Ingestion</tspan></text><text x="240" y="146" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="240" dy="0">• chunk + embed  (ch. 2-3)</tspan></text><text x="240" y="167" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="240" dy="0">• extract with LLM  (ch. 6-7)</tspan></text><text x="240" y="188" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="240" dy="0">• resolve entities  (ch. 6)</tspan></text><text x="240" y="209" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="240" dy="0">• summarize + communities  (ch. 7)</tspan></text><path d="M474.0,160.0 L512.0,160.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><path d="M514,105 L514,219 A205.0,13 0 0,0 924,219 L924,105" fill="#e8f4dc" stroke="#4c8a1d" stroke-width="2"/><ellipse cx="719.0" cy="105" rx="205.0" ry="13" fill="#ffffff" stroke="#4c8a1d" stroke-width="2"/><text x="719.0" y="180.10000000000002" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="719.0" dy="0">ArangoDB 3.12</tspan></text><rect x="538" y="181" width="76.48" height="22" rx="11.0" fill="#fff3d4" stroke="#a87500" stroke-width="1.2"/><text x="576.24" y="197" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="576.24" dy="0">documents</tspan></text><rect x="636" y="181" width="89.92" height="22" rx="11.0" fill="#e8f4dc" stroke="#4c8a1d" stroke-width="1.2"/><text x="680.96" y="197" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="680.96" dy="0">graph edges</tspan></text><rect x="734" y="181" width="96.64000000000001" height="22" rx="11.0" fill="#e4effb" stroke="#2b67ad" stroke-width="1.2"/><text x="782.32" y="197" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="782.32" dy="0">vector index</tspan></text><rect x="832" y="181" width="89.92" height="22" rx="11.0" fill="#f2efe8" stroke="#8b8578" stroke-width="1.2"/><text x="876.96" y="197" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="876.96" dy="0">search view</tspan></text><path d="M720.0,234.0 L720.0,270.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)" marker-start="url(#ah1f2933)"/><text x="744.0" y="256.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="744.0" dy="0">AQL</tspan></text><rect x="420" y="272" width="510" height="96" rx="14" fill="#ffffff" stroke="#e3d9c6" stroke-width="2"/><text x="675" y="294" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="675" dy="0">Retrievers</tspan></text><rect x="436" y="307" width="103.36000000000001" height="22" rx="11.0" fill="#e4effb" stroke="#2b67ad" stroke-width="1.2"/><text x="487.68" y="323" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="487.68" dy="0">vector/hybrid</tspan></text><rect x="600" y="307" width="89.92" height="22" rx="11.0" fill="#e4effb" stroke="#2b67ad" stroke-width="1.2"/><text x="644.96" y="323" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="644.96" dy="0">parent docs</tspan></text><rect x="764" y="307" width="103.36000000000001" height="22" rx="11.0" fill="#e4effb" stroke="#2b67ad" stroke-width="1.2"/><text x="815.6800000000001" y="323" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="815.6800000000001" dy="0">AQL templates</tspan></text><rect x="436" y="337" width="69.76" height="22" rx="11.0" fill="#e4effb" stroke="#2b67ad" stroke-width="1.2"/><text x="470.88" y="353" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="470.88" dy="0">text2aql</tspan></text><rect x="600" y="337" width="49.6" height="22" rx="11.0" fill="#e4effb" stroke="#2b67ad" stroke-width="1.2"/><text x="624.8" y="353" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="624.8" dy="0">local</tspan></text><rect x="764" y="337" width="56.32000000000001" height="22" rx="11.0" fill="#e4effb" stroke="#2b67ad" stroke-width="1.2"/><text x="792.16" y="353" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="792.16" dy="0">global</tspan></text><path d="M418.0,320.0 L352.0,320.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)" marker-start="url(#ah1f2933)"/><rect x="170" y="280" width="180" height="84" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="260.0" y="309.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="260.0" dy="0">Agent</tspan></text><text x="260.0" y="329.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="260.0" dy="0">router · query updater ·</tspan><tspan x="260.0" dy="16.25">critic</tspan></text><path d="M260.0,366.0 L260.0,404.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="170" y="406" width="180" height="54" rx="12" fill="#e3f5ea" stroke="#1e8449" stroke-width="2"/><text x="260.0" y="427.77500000000003" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="260.0" dy="0">LLM answer</tspan></text><text x="260.0" y="447.125" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="260.0" dy="0">grounded + cited</tspan></text><circle cx="76" cy="300" r="9.9" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><path d="M58.9,334.2 Q58.9,313.5 76,313.5 Q93.1,313.5 93.1,334.2 z" fill="#fde7e1" stroke="#c4462a" stroke-width="2" stroke-linejoin="round"/><path d="M100.0,322.0 L168.0,322.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)" marker-start="url(#ah1f2933)"/><rect x="420" y="404" width="510" height="64" rx="12" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><text x="675.0" y="423.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="675.0" dy="0">Evaluation loop</tspan></text><text x="675.0" y="443.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="675.0" dy="0">benchmark with AQL ground truth · recall · faithfulness · correctness ·</tspan><tspan x="675.0" dy="16.25">latency</tspan></text><path d="M860.0,402.0 L860.0,372.0" fill="none" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#ahc0392b)"/><text x="894.0" y="391.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="normal" font-style="italic" stroke="#fffdf6" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan x="894.0" dy="0">improve</tspan></text><text x="340" y="500" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal"><tspan x="340" dy="0">every failure becomes a test, a few-shot example or a new tool</tspan></text><rect x="780" y="253" width="96.64000000000001" height="22" rx="11.0" fill="#efe8fb" stroke="#6847c0" stroke-width="1.2"/><text x="828.32" y="269" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal"><tspan x="828.32" dy="0">also via MCP</tspan></text></svg>
