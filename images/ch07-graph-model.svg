ke-width="2" marker-end="url(#ah1f2933)"/><text x="485" y="236" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal" font-style="italic"><tspan x="485" dy="0">related (raw)</tspan></text><path d="M410,186 C330,350 640,350 560,186" fill="none" stroke="#4c8a1d" stroke-width="3" marker-end="url(#ah4c8a1d)"/><text x="485" y="332" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#4c8a1d" text-anchor="middle" font-weight="bold"><tspan x="485" dy="0">summarized (1 per pair)</tspan></text><rect x="40" y="330" width="330" height="81.8" rx="10" fill="#ffffff" stroke="#b9b2a2" stroke-width="1.5"/><text x="49" y="350" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">// entities/ORESTES</text><text x="49" y="365.95" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">&quot;descriptions&quot;: [ &quot;…son of Agamemnon…&quot;,</text><text x="49" y="381.9" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">   &quot;…praised for avenging…&quot;, … ],</text><text x="49" y="397.84999999999997" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">&quot;summary&quot;: &quot;Orestes is the son of …&quot;</text><rect x="620" y="330" width="310" height="65.85" rx="10" fill="#ffffff" stroke="#b9b2a2" stroke-width="1.5"/><text x="629" y="350" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#1f2933" xml:space="preserve">// TELEMACHUS - MINERVA</text><text x="629" y="365.95" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas