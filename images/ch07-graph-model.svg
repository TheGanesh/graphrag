<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d"><title id="t">The GraphRAG index in ArangoDB</title><desc id="d">chunks link to entities via has_entity; entities link to each other via related (one raw edge per extracted relationship, many per pair) and summarized (one edge per pair with an LLM summary); entities link to communities via in_community. Entity documents keep the raw descriptions list and a summary.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker><marker id="ah4c8a1d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#4c8a1d"/></marker></defs><rect x="1" y="1" width="958" height="438" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">The GraphRAG index in ArangoDB</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">three document collections, four edge collections - and two levels of detail</text><rect x="40" y="120" width="170" height="64" rx="12" fill="#fff3d4" stroke="#a87500" stroke-width="2"/><text x="125.0" y="147.475" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="125.0" dy="0">chunks</tspan></text><text x="125.0" y="168.92499999999998" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="125.0" dy="0">book, chunk, text</tspan></text><rect x="390" y="120" width="190" heigh