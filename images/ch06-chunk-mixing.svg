<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d"><title id="t">Why chunks alone fail on contracts</title><desc id="d">Left: a vector search for ACME's payment terms returns payment clauses from three different contracts, and the LLM blends them. Right: the graph first finds ACME's contract via has_party, then ranks only that contract's chunks by similarity.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker></defs><rect x="1" y="1" width="958" height="468" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Why chunks alone fail on contracts</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">similar-sounding text from the wrong contract vs. narrowing down with the graph first</text><rect x="30" y="92" width="430" height="350" rx="16" fill="#ffffff" stroke="#e3d9c6" stroke-width="2"/><rect x="500" y="92" width="430" height="350" rx="16" fill="#ffffff" stroke="#e3d9c6" stroke-width="2"/><text x="245" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="245" dy="0">Chunks only</tspan></text><text x="715" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="715" dy="0">Graph first, then vectors</tspan></text><rect x="60" y="140" width="370" height="44" rx="12" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><text x="245.0" y="166.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14"