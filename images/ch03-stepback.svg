<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d"><title id="t">Step-back prompting</title><desc id="d">The user's specific question is rewritten by an LLM into a broader step-back question; the broader question is embedded and used for retrieval; the retrieved documents plus the ORIGINAL question go to the LLM that writes the answer.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker><marker id="ahc0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#c0392b"/></marker></defs><rect x="1" y="1" width="958" height="428" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Step-back prompting</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">search with a broader question, answer the specific one</text><circle cx="56" cy="130" r="9.9" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><path d="M38.9,164.2 Q38.9,143.5 56,143.5 Q73.1,143.5 73.1,164.2 z" fill="#fde7e1" stroke="#c4462a" stroke-width="2" stroke-linejoin="round"/><rect x="90" y="112" width="250" height="70" rx="12" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><text x="215.0" y="141.15" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="215.0" dy="0">When was Einstein granted the</tspan></text><text x="215.0" y="160.55" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="215.0" dy="0">patent for his blouse design?</tspan></text><path d="M342.0,147.0 L392.0,147.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><line x1="412.0" y1="105" x2="412.0" y2="112" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="412.0" y1="182" x2="412.0" y2="189" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="456.6666666666667" y1="105" x2="456.6666666666667" y2="112" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="456.6666666666667" y1="182" x2="456.6666666666667" y2="189" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="501.3333333333333" y1="105" x2="501.3333333333333" y2="112" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="501.3333333333333" y1="182" x2="501.3333333333333" y2="189" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="546.0" y1="105" x2="546.0" y2="112" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="546.0" y1="182" x2="546.0" y2="189" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><rect x="394" y="112" width="170" height="70" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="479.0" y="134.35" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="479.0" dy="0">LLM</tspan></text><text x="479.0" y="155.79999999999998" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="479.0" dy="0">step-back prompt +</tspan><tspan x="479.0" dy="16.25">examples</tspan></text><path d="M548,121 l2.5,6 6,2.5 -6,2.5 -2.5,6 -2.5,-6 -6,-2.5 6,-2.5 z" fill="#6847c0" opacity="0.8"/><path d="M566.0,147.0 L614.0,147.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="616" y="112" width="30