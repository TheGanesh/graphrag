<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d"><title id="t">text2aql: the LLM writes the query, the database checks it</title><desc id="d">The question, the schema sampled from ArangoDB, terminology mappings, few-shot examples and format instructions are assembled into a prompt. The LLM returns AQL. EXPLAIN checks it without running it; a read-only user executes it with a time limit; if anything fails, the error message goes back to the LLM for another attempt.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker><marker id="ahc0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#c0392b"/></marker></defs><rect x="1" y="1" width="958" height="468" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">text2aql: the LLM writes the query, the database checks it</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">a prompt with the schema in, an AQL query out - then EXPLAIN, run read-only, retry on error</text><rect x="40" y="110" width="170" height="42" rx="12" fill="#fde7e1" stroke="#c4462a" stroke-width="2"/><text x="125.0" y="135.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="125.0" dy="0">question</tspan></text><path d="M212.0,131.0 L262.0,230.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><rect x="40" y="164" width="170" heigh