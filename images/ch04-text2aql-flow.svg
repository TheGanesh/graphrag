ze="12" fill="#e8edf2" xml:space="preserve">PROMPT</text><text x="274" y="205.4" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#e8edf2" xml:space="preserve">{schema}</text><text x="274" y="222.8" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#e8edf2" xml:space="preserve">{terminology}</text><text x="274" y="240.20000000000002" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#e8edf2" xml:space="preserve">{examples}</text><text x="274" y="257.6" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#e8edf2" xml:space="preserve">{question}</text><path d="M426.0,230.0 L466.0,230.0" fill="none" stroke="#1f2933" stroke-width="2" stroke-linecap="round" marker-end="url(#ah1f2933)"/><line x1="486.0" y1="189" x2="486.0" y2="196" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="486.0" y1="264" x2="486.0" y2="271" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="514.0" y1="189" x2="514.0" y2="196" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="514.0" y1="264" x2="514.0" y2="271" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="542.0" y1="189" x2="542.0" y2="196" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="542.0" y1="264" x2="542.0" y2="271" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="570.0" y1="189" x2="570.0" y2="196" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><line x1="570.0" y1="264" x2="570.0" y2="271" stroke="#6847c0" stroke-width="3" stroke-linecap="round"/><rect x="468" y="196" width="120" height="68" rx="12" fill="#efe8fb" stroke="#6847c0" stroke-width="2"/><text x="528.0" y="235.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill=