<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d"><title id="t">Hybrid search = two rankings, made comparable, merged</title><desc id="d">Vector search returns cosine scores and BM25 keyword search returns unbounded scores. Each list is divided by its own maximum so both top out at 1.0; the lists are merged and each chunk keeps its highest normalized score; the top-k form the context.</desc><defs><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2933"/></marker></defs><rect x="1" y="1" width="958" height="518" rx="18" fill="#fffdf6" stroke="#e3d9c6" stroke-width="2"/><text x="28" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1f2933">Hybrid search = two rankings, made comparable, merged</text><text x="28" y="70" font-family="'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive" font-size="16" fill="#5b6670">example numbers: divide each list by its best score, then keep each chunk once (MAX)</text><rect x="40" y="100" width="250" height="50" rx="12" fill="#e4effb" stroke="#2b67ad" stroke-width="2"/><text x="165.0" y="120.125" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold"><tspan x="165.0" dy="0">vector search</tspan></text><text x="165.0" y="140.525" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6670" text-anchor="middle" font-weight="normal"><tspan x="165.0" dy="0">APPROX_NEAR_COSINE</tspan></text><text x="54" y="174" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal"><tspan x="54" dy="0">chunk 42</tspan></text><text x="276" y="1